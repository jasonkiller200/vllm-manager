<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vLLM Manager - 初始化管理者</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .init-container { width: 100%; max-width: 480px; padding: 20px; }
        .init-header { text-align: center; margin-bottom: 32px; }
        .init-header h1 { font-size: 2em; color: #58a6ff; margin-bottom: 8px; }
        .init-header .subtitle { color: #8b949e; font-size: 0.9em; margin-bottom: 4px; }
        .init-header .notice { color: #d29922; font-size: 0.8em; }
        .init-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.85em;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        .form-group .hint { font-size: 0.75em; color: #484f58; margin-top: 4px; }
        .btn-init {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-init:hover { background: #2ea043; }
        .btn-init:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
        .error-message {
            background: #44111a;
            color: #f85149;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85em;
            border-left: 3px solid #f85149;
            display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            background: #0d4429;
            color: #3fb950;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85em;
            border-left: 3px solid #3fb950;
            display: none;
        }
        .success-message.show { display: block; }
        .bg-decoration {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: -1; opacity: 0.03;
            background:
                radial-gradient(circle at 20% 20%, #58a6ff 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #3fb950 0%, transparent 50%);
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="init-container">
        <div class="init-header">
            <h1>🚀 vLLM Manager</h1>
            <div class="subtitle">初始化管理者帳號</div>
            <div class="notice">⚠️ 此為首位管理者，完成後此頁面將關閉</div>
        </div>

        <div class="init-card">
            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>
            
            <form id="init-form">
                <div class="form-group">
                    <label>管理者帳號</label>
                    <input type="text" id="username" name="username" placeholder="請設定帳號" required>
                    <div class="hint">此帳號將擁有完整系統管理權限</div>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="password" name="password" placeholder="請設定密碼" required minlength="6">
                    <div class="hint">至少 6 個字元</div>
                </div>
                <div class="form-group">
                    <label>確認密碼</label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="再次輸入密碼" required minlength="6">
                </div>
                <button type="submit" class="btn-init" id="init-btn">建立管理者帳號</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('init-form');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const initBtn = document.getElementById('init-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            initBtn.disabled = true;
            initBtn.textContent = '建立中...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (password !== passwordConfirm) {
                errorMsg.textContent = '兩次密碼輸入不一致';
                errorMsg.classList.add('show');
                initBtn.disabled = false;
                initBtn.textContent = '建立管理者帳號';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = '密碼至少需要 6 個字元';
                errorMsg.classList.add('show');
                initBtn.disabled = false;
                initBtn.textContent = '建立管理者帳號';
                return;
            }

            try {
                const response = await fetch('/api/auth/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'ok') {
                    successMsg.textContent = '✅ ' + data.message + '，正在跳轉到登入頁面...';
                    successMsg.classList.add('show');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    errorMsg.textContent = data.message || '建立失敗';
                    errorMsg.classList.add('show');
                    initBtn.disabled = false;
                    initBtn.textContent = '建立管理者帳號';
                }
            } catch (err) {
                errorMsg.textContent = '連線錯誤，請稍後再試';
                errorMsg.classList.add('show');
                initBtn.disabled = false;
                initBtn.textContent = '建立管理者帳號';
            }
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
